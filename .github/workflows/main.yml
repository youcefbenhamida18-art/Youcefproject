name: Auto YouTube Shorts

on:
  schedule:
    - cron: '0 16 * * *'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v3

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install Pillow moviepy google-api-python-client google-auth-oauthlib google-auth-httplib2

    - name: Run script
      env:
        CLIENT_SECRET: ${{ secrets.CLIENT_SECRET }}
        YOUTUBE_TOKEN: ${{ secrets.YOUTUBE_TOKEN }}
      run: |
        python main.py

