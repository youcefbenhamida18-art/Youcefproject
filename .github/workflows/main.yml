name: Auto YouTube Shorts

on:
  schedule:
    - cron: '0 16 * * *' # يعمل تلقائياً كل يوم الساعة 4 عصراً بتوقيت غرينتش
  workflow_dispatch: # يتيح لك زر لتشغيل السكربت يدوياً متى شئت من لوحة تحكم GitHub

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v3

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Run script
      env:
        CLIENT_SECRET: ${{ secrets.CLIENT_SECRET }}
        YOUTUBE_TOKEN: ${{ secrets.YOUTUBE_TOKEN }}
      run: |
        python main.py
