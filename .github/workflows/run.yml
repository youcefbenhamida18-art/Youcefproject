name: Run Auto Machine

on:
  schedule:
    - cron: '0 8 * * *' # سيعمل الكود تلقائياً كل يوم الساعة 8 صباحاً
  workflow_dispatch: # يتيح لك تشغيله يدوياً متى شئت بضغطة زر

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Run main script
        uses: actions/python-script@v5
        with:
          script: |
            import os
            print("مرحباً! الآلة السحابية تعمل الآن أوتوماتيكياً بنجاح تام.")
